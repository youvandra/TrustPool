name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
        env:
          FOUNDRY_FUZZ_RUNS: 1000
          FOUNDRY_INVARIANT_RUNS: 256

  apps:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trustpool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: npm ci
      - name: generated contract bindings are up to date
        run: |
          npm run sync:contracts
          git diff --exit-code -- packages/core/src/contracts/abi.ts
      - run: npm run typecheck
      - name: API tests on embedded Postgres (PGlite)
        run: npm test -w @trustpool/api
        env:
          LOG_LEVEL: silent
      - name: API tests on a Postgres server
        run: npm test -w @trustpool/api
        env:
          LOG_LEVEL: silent
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trustpool_test
      - name: migrations match the schema
        working-directory: apps/api
        run: |
          npx drizzle-kit generate --name ci-check
          git diff --exit-code -- drizzle
          test -z "$(git status --porcelain -- drizzle)"
      - name: indexer against anvil
        env:
          LOG_LEVEL: silent
        run: |
          anvil --silent &
          sleep 2
          cd contracts
          KEY=$(cast wallet private-key "test test test test test test test test test test test junk" 0)
          forge script script/Deploy.s.sol --rpc-url http://127.0.0.1:8545 --broadcast --private-key "$KEY"
          forge script script/SeedLocal.s.sol --rpc-url http://127.0.0.1:8545 --broadcast
          cd .. && node scripts/sync-contracts.mjs
          cd apps/api && E2E_RPC_URL=http://127.0.0.1:8545 bun test indexer.e2e
          # moves anvil's clock, so it runs after the indexer check
          E2E_RPC_URL=http://127.0.0.1:8545 bun test keeper.e2e
      - run: npm run build

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t trustpool-api .
      - name: image starts and answers /health
        run: |
          docker run -d --name api -p 8787:8787 trustpool-api
          for i in $(seq 1 20); do curl -fsS localhost:8787/api/health && exit 0; sleep 1; done
          docker logs api; exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: open, announce, settle through the UI on anvil
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
