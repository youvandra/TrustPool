[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# Deploy scripts write contracts/deployments/<chainId>.json; `npm run sync:contracts` copies it into @trustpool/core.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad = "${MONAD_RPC}"

# Local runs stay quick; CI sets FOUNDRY_INVARIANT_RUNS higher.
[invariant]
runs = 64
depth = 250
